# Single-node SeaweedFS (master+volume+filer+S3) as the S3 backend for Mimir.
# In-cluster endpoint: http://seaweedfs.storage.svc:8333   (local test creds below)
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
stringData:
  s3.json: |
    {"identities":[{"name":"admin","credentials":[{"accessKey":"admin","secretKey":"adminadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -filer
            - -s3
            - -s3.config=/etc/s3/s3.json
            - -master.volumeSizeLimitMB=512
          ports:
            - {name: master, containerPort: 9333}
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: s3}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/s3, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3-config
          secret: {secretName: seaweedfs-s3}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: master, port: 9333}
    - {name: s3, port: 8333}
---
# S3 reachable from the Mac at http://localhost:30333
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-nodeport
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, nodePort: 30333}
