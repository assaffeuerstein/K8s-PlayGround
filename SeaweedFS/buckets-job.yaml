# Creates the Mimir buckets via the S3 API once SeaweedFS is up (PUT on an existing bucket is harmless).
apiVersion: batch/v1
kind: Job
metadata:
  name: create-buckets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for b in mimir-blocks mimir-ruler mimir-alertmanager; do
                curl -sS --retry 30 --retry-delay 2 --retry-connrefused --fail-with-body \
                  --aws-sigv4 "aws:amz:us-east-1:s3" --user admin:adminadmin \
                  -X PUT "http://seaweedfs:8333/$b" -o /dev/null -w "$b: %{http_code}\n"
              done
