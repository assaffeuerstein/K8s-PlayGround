apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/assaffeuerstein/K8s-PlayGround.git
    targetRevision: main
    path: SeaweedFS
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
