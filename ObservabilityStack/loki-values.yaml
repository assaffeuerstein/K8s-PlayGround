# Loki single-binary, chunks/index in SeaweedFS S3. Test credentials, local use only.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: http://seaweedfs.storage.svc:8333
      region: us-east-1
      accessKeyId: admin
      secretAccessKey: adminadmin
      s3ForcePathStyle: true
      insecure: true
  pattern_ingester: {enabled: true}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence: {size: 5Gi}
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}

# scalable-mode components off
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomCompactor: {replicas: 0}
bloomGateway: {replicas: 0}

minio: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
