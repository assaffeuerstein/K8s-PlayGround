apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - {op: add, path: /spec/template/spec/volumes/-, value: {name: netskope-ca, configMap: {name: netskope-ca}}}
      - {op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: {name: netskope-ca, mountPath: /etc/netskope-ca, readOnly: true}}
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SSL_CERT_DIR, value: /etc/netskope-ca}}
  # UI/API on http://localhost:30080 (Docker Desktop exposes NodePorts on localhost)
  - target: {kind: Service, name: argocd-server}
    patch: |-
      - {op: replace, path: /spec/type, value: NodePort}
      - {op: add, path: /spec/ports/0/nodePort, value: 30080}
  # plain HTTP, no self-signed cert warnings for local use
  - target: {kind: ConfigMap, name: argocd-cmd-params-cm}
    patch: |-
      - {op: add, path: /data, value: {server.insecure: "true"}}
# Netskope TLS inspection: helm pull in repo-server must trust its CA.
# (argocd-tls-certs-cm is not used for repos that aren't registered, so extend Go's trust dir instead.)
configMapGenerator:
  - name: netskope-ca
    files:
      - netskope-chain.crt=certs/netskope-chain.crt
generatorOptions:
  disableNameSuffixHash: true
