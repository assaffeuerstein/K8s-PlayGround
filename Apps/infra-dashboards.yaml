apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/assaffeuerstein/K8s-PlayGround.git
    targetRevision: main
    path: InfraObservability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
