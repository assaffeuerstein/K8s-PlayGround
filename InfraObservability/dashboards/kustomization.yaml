apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
# Grafana sidecar loads any ConfigMap labelled grafana_dashboard; folder comes from the annotation.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
configMapGenerator:
  - name: dashboard-pure-flasharray-overview
    files:
      - pure-flasharray-overview.json
