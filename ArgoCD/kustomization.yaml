apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  # UI/API on http://localhost:30080 (Docker Desktop exposes NodePorts on localhost)
  - target: {kind: Service, name: argocd-server}
    patch: |-
      - {op: replace, path: /spec/type, value: NodePort}
      - {op: add, path: /spec/ports/0/nodePort, value: 30080}
  # plain HTTP, no self-signed cert warnings for local use
  - target: {kind: ConfigMap, name: argocd-cmd-params-cm}
    patch: |-
      - {op: add, path: /data, value: {server.insecure: "true"}}
