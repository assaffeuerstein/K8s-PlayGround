apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/InfraObservability/alloy-values.yaml
    - repoURL: https://github.com/assaffeuerstein/K8s-PlayGround.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-observability
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
